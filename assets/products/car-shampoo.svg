<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="sh-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#008B8D"/>
      <stop offset="80%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="sh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#008B8D" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="180" rx="42" ry="8" fill="#CBD5E0" opacity="0.6"/>
  <g filter="url(#sh-shadow)">
    <!-- 1 Liter Jug Body with Side Handle -->
    <path d="M72 85 C72 74 85 70 95 70 L115 70 C125 70 132 78 132 88 L132 166 C132 172 68 172 68 166 L68 100 Z" fill="url(#sh-grad)"/>
    <!-- Molded Handle Loop -->
    <path d="M68 95 C55 95 55 135 68 135 Z" fill="#0F766E"/>
    <path d="M68 103 C60 103 60 127 68 127 Z" fill="#F8FAFC"/>
    <!-- Bottle Cap with Measuring Ring -->
    <rect x="98" y="55" width="16" height="15" rx="3" fill="#1E293B"/>
    <line x1="98" y1="60" x2="114" y2="60" stroke="#64748B" stroke-width="1"/>
    <!-- Front Detail Label -->
    <rect x="76" y="94" width="50" height="58" rx="4" fill="#FFFFFF"/>
    <rect x="76" y="94" width="50" height="14" fill="#008B8D"/>
    <text x="101" y="104" font-family="system-ui, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">CERAMIC</text>
    <text x="101" y="117" font-family="system-ui, sans-serif" font-size="4.5" font-weight="700" fill="#1E293B" text-anchor="middle">FOAM SHAMPOO</text>
    <text x="101" y="125" font-family="system-ui, sans-serif" font-size="3.5" font-weight="600" fill="#64748B" text-anchor="middle">pH NEUTRAL</text>
    <rect x="85" y="132" width="32" height="7" rx="2" fill="#E6F7F7"/>
    <text x="101" y="137.5" font-family="system-ui, sans-serif" font-size="4" font-weight="800" fill="#008B8D" text-anchor="middle">1000 ML</text>
  </g>
  <!-- Foam Lather Suds -->
  <circle cx="128" cy="78" r="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <circle cx="136" cy="85" r="4.5" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
</svg>