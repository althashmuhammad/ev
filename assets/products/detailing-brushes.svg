<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="br-handle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="br-bristles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="br-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="176" rx="60" ry="8" fill="#CBD5E0" opacity="0.6"/>
  <!-- 3 Graduated Detailing Brushes Standing Fans -->
  <g filter="url(#br-shadow)">
    <!-- Left Small Brush -->
    <g transform="rotate(-15 65 110)">
      <rect x="62" y="90" width="7" height="65" rx="3.5" fill="url(#br-handle)"/>
      <circle cx="65.5" cy="148" r="1.5" fill="#CBD5E0"/>
      <rect x="61" y="80" width="9" height="10" fill="#008B8D"/>
      <path d="M60 80 C58 55 73 55 71 80 Z" fill="url(#br-bristles)"/>
    </g>
    <!-- Right Medium Brush -->
    <g transform="rotate(15 135 110)">
      <rect x="131" y="85" width="9" height="70" rx="4.5" fill="url(#br-handle)"/>
      <circle cx="135.5" cy="148" r="1.5" fill="#CBD5E0"/>
      <rect x="130" y="74" width="11" height="11" fill="#008B8D"/>
      <path d="M129 74 C126 48 143 48 141 74 Z" fill="url(#br-bristles)"/>
    </g>
    <!-- Center Hero Brush (Large) -->
    <rect x="94" y="80" width="12" height="80" rx="6" fill="url(#br-handle)"/>
    <circle cx="100" cy="152" r="2.5" fill="#CBD5E0"/>
    <rect x="92" y="66" width="16" height="14" rx="2" fill="#008B8D"/>
    <!-- Ultra Soft Synthetic Bristle Fan -->
    <path d="M91 66 C87 35 113 35 109 66 Z" fill="url(#br-bristles)"/>
    <!-- Bristle Hair Lines -->
    <g stroke="#CBD5E0" stroke-width="0.8" opacity="0.6">
      <line x1="95" y1="64" x2="96" y2="42"/>
      <line x1="99" y1="64" x2="99" y2="38"/>
      <line x1="102" y1="64" x2="101" y2="38"/>
      <line x1="105" y1="64" x2="104" y2="42"/>
    </g>
  </g>
  <text x="100" y="24" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#008B8D" text-anchor="middle" letter-spacing="0.5">5-PIECE SET</text>
</svg>