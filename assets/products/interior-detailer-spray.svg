<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bot-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005B63"/>
      <stop offset="35%" stop-color="#008B8D"/>
      <stop offset="70%" stop-color="#005B63"/>
      <stop offset="100%" stop-color="#003E43"/>
    </linearGradient>
    <linearGradient id="trig-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="bot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#005B63" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="180" rx="38" ry="8" fill="#CBD5E0" opacity="0.6"/>
  <g filter="url(#bot-shadow)">
    <!-- Bottle Cylindrical Body -->
    <path d="M74 95 C74 88 84 80 92 78 L108 78 C116 80 126 88 126 95 L126 166 C126 172 74 172 74 166 Z" fill="url(#bot-body)"/>
    <ellipse cx="100" cy="166" rx="26" ry="6" fill="#003E43"/>
    <!-- Bottle Neck -->
    <rect x="93" y="65" width="14" height="14" fill="#003E43"/>
    <rect x="91" y="60" width="18" height="6" rx="1.5" fill="#334155"/>
    <!-- Ergonomic Trigger Head -->
    <path d="M90 60 L90 42 C90 38 120 38 120 45 L128 48 L128 55 L108 55 L108 60 Z" fill="url(#trig-grad)"/>
    <!-- Front Spray Nozzle Tip -->
    <rect x="128" y="46" width="8" height="10" rx="1.5" fill="#00E5FF"/>
    <!-- Ergonomic Finger Trigger Lever -->
    <path d="M112 55 C116 65 118 78 114 85 L108 82 C111 76 110 65 106 55 Z" fill="#0F172A"/>
    <!-- Premium Product Label -->
    <rect x="78" y="102" width="44" height="52" rx="3" fill="#FFFFFF"/>
    <rect x="78" y="102" width="44" height="12" fill="#008B8D"/>
    <text x="100" y="110" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle">INTERIOR</text>
    <text x="100" y="122" font-family="system-ui, sans-serif" font-size="4.5" font-weight="700" fill="#1E293B" text-anchor="middle">MATTE UV</text>
    <text x="100" y="129" font-family="system-ui, sans-serif" font-size="3.5" font-weight="600" fill="#64748B" text-anchor="middle">DASH &amp; LEATHER</text>
    <rect x="86" y="136" width="28" height="6" rx="1.5" fill="#E6F7F7"/>
    <text x="100" y="140.5" font-family="system-ui, sans-serif" font-size="3.5" font-weight="800" fill="#008B8D" text-anchor="middle">500 ML</text>
  </g>
  <!-- Fine Mist Spray Droplets -->
  <g fill="#00E5FF" opacity="0.8">
    <circle cx="145" cy="46" r="2"/>
    <circle cx="155" cy="43" r="1.5"/>
    <circle cx="162" cy="49" r="2.5"/>
    <circle cx="172" cy="42" r="1.5"/>
    <circle cx="180" cy="48" r="2"/>
  </g>
</svg>