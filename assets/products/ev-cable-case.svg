<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bag-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <filter id="bag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="176" rx="65" ry="10" fill="#CBD5E0" opacity="0.6"/>
  <!-- Sturdy Carry Handle at Top -->
  <path d="M80 50 C80 32 120 32 120 50" stroke="#0F172A" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M82 50 C82 36 118 36 118 50" stroke="#008B8D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Circular Padded Oxford Case Body -->
  <g filter="url(#bag-shadow)">
    <!-- Round Shell -->
    <circle cx="100" cy="110" r="58" fill="url(#bag-grad)" stroke="#475569" stroke-width="2"/>
    <!-- Perimeter Double Zip Track with Teal Accent -->
    <circle cx="100" cy="110" r="54" fill="none" stroke="#008B8D" stroke-width="2.5" stroke-dasharray="8 3"/>
    <circle cx="100" cy="110" r="48" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Embossed EV Plug Symbol Front Graphic -->
    <circle cx="100" cy="110" r="32" fill="#0F172A" stroke="#008B8D" stroke-width="1.5"/>
    <!-- Electric Plug Artwork -->
    <path d="M92 98 L92 106 L108 106 L108 98" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <line x1="96" y1="92" x2="96" y2="98" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="104" y1="92" x2="104" y2="98" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M100 106 L100 124 C100 128 112 128 112 122 L112 116" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Dual Alloy Zip Pullers -->
    <rect x="144" y="85" width="8" height="14" rx="2" fill="#94A3B8" transform="rotate(30 144 85)"/>
    <rect x="142" y="88" width="6" height="4" rx="1" fill="#008B8D" transform="rotate(30 142 88)"/>
  </g>
</svg>