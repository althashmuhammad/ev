<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cushion-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="mesh-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cushion-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="174" rx="65" ry="10" fill="#CBD5E0" opacity="0.6"/>
  <!-- Secondary Pillow Behind (Pair Representation) -->
  <g opacity="0.5" transform="translate(18, -20) scale(0.85)">
    <path d="M40 95 C40 65 60 72 100 82 C140 72 160 65 160 95 C160 125 135 135 100 120 C65 135 40 125 40 95 Z" fill="#334155"/>
  </g>
  <!-- Main Ergonomic Contoured Neck Pillow -->
  <g filter="url(#cushion-shadow)">
    <!-- Back Elastic Seat Strap -->
    <rect x="70" y="70" width="60" height="12" rx="4" fill="#0F172A"/>
    <!-- Pillow 3D Ergonomic Butterfly Silhouette -->
    <path d="M35 105 C35 70 60 76 100 90 C140 76 165 70 165 105 C165 140 138 152 100 134 C62 152 35 140 35 105 Z" fill="url(#cushion-grad)" stroke="#008B8D" stroke-width="1.5"/>
    <!-- Center Breathable Sport Mesh Panel -->
    <path d="M55 105 C55 86 72 90 100 100 C128 90 145 86 145 105 C145 124 125 132 100 122 C75 132 55 124 55 105 Z" fill="url(#mesh-grad)"/>
    <!-- Mesh Perforation Dots -->
    <g fill="#64748B" opacity="0.6">
      <circle cx="85" cy="102" r="1.2"/><circle cx="95" cy="102" r="1.2"/><circle cx="105" cy="102" r="1.2"/><circle cx="115" cy="102" r="1.2"/>
      <circle cx="80" cy="108" r="1.2"/><circle cx="90" cy="108" r="1.2"/><circle cx="100" cy="108" r="1.2"/><circle cx="110" cy="108" r="1.2"/><circle cx="120" cy="108" r="1.2"/>
      <circle cx="85" cy="114" r="1.2"/><circle cx="95" cy="114" r="1.2"/><circle cx="105" cy="114" r="1.2"/><circle cx="115" cy="114" r="1.2"/>
    </g>
    <!-- Teal Piping Stitching Edge -->
    <path d="M42 98 C48 78 72 84 100 96 C128 84 152 78 158 98" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Memory Foam Rebound Tag -->
    <rect x="146" y="120" width="16" height="7" rx="1.5" fill="#008B8D"/>
    <text x="154" y="125.5" font-family="system-ui, sans-serif" font-size="4" font-weight="900" fill="#FFFFFF" text-anchor="middle">PAIR</text>
  </g>
</svg>