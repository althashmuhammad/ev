<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="glass-reflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#008B8D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#008B8D" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="174" rx="65" ry="9" fill="#CBD5E0" opacity="0.6"/>
  <!-- Angled Floating 2.5D Curved Tempered Glass Guard -->
  <g filter="url(#glass-shadow)" transform="rotate(-6 100 100)">
    <!-- Base Display Frame Silhouette -->
    <rect x="25" y="60" width="150" height="85" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <!-- Glass Guard Shield Floating Above -->
    <rect x="28" y="63" width="144" height="79" rx="10" fill="url(#glass-reflect)" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Diagonal Crystal Light Flare -->
    <polygon points="50,63 70,63 115,142 95,142" fill="#FFFFFF" opacity="0.35"/>
    <polygon points="120,63 130,63 155,115 145,115" fill="#FFFFFF" opacity="0.25"/>
    <!-- 9H Hardness Badge -->
    <rect x="36" y="70" width="28" height="12" rx="3" fill="#008B8D"/>
    <text x="50" y="79" font-family="system-ui, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">9H NANO</text>
    <!-- Touch Sensitivity Wave -->
    <circle cx="140" cy="115" r="10" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.7"/>
    <circle cx="140" cy="115" r="5" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
  </g>
</svg>