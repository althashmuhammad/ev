<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="sad-alloy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="sad-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="60%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </radialGradient>
    <filter id="sad-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="174" rx="55" ry="9" fill="#CBD5E0" opacity="0.6"/>
  <g filter="url(#sad-shadow)">
    <!-- Base Circular Dashboard Cup -->
    <ellipse cx="100" cy="150" rx="52" ry="16" fill="url(#sad-alloy)" stroke="#64748B" stroke-width="1"/>
    <ellipse cx="100" cy="146" rx="46" ry="13" fill="#0F172A"/>
    <!-- Solar Cells Grid Ring on Base -->
    <ellipse cx="100" cy="145" rx="42" ry="11" fill="#1E293B" stroke="#008B8D" stroke-width="1"/>
    <g stroke="#334155" stroke-width="1">
      <line x1="75" y1="140" x2="125" y2="150"/>
      <line x1="125" y1="140" x2="75" y2="150"/>
      <line x1="100" y1="135" x2="100" y2="155"/>
    </g>
    <!-- Levitating Outer Gyroscope Alloy Ring -->
    <ellipse cx="100" cy="100" rx="44" ry="22" fill="none" stroke="url(#sad-alloy)" stroke-width="6" transform="rotate(-25 100 100)"/>
    <ellipse cx="100" cy="100" rx="42" ry="20" fill="none" stroke="#38BDF8" stroke-width="1.5" transform="rotate(-25 100 100)" opacity="0.8"/>
    <!-- Intersecting Inner Levitating Ring -->
    <ellipse cx="100" cy="100" rx="34" ry="16" fill="none" stroke="url(#sad-alloy)" stroke-width="5" transform="rotate(35 100 100)"/>
    <ellipse cx="100" cy="100" rx="32" ry="14" fill="none" stroke="#2DD4BF" stroke-width="1.5" transform="rotate(35 100 100)" opacity="0.8"/>
    <!-- Floating Center Fragrance Turbine Pearl -->
    <circle cx="100" cy="100" r="14" fill="url(#sad-core)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="96" cy="95" r="4" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <!-- Natural Aroma Scent Waves -->
  <path d="M90 60 C85 45 95 35 90 20" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M104 55 C110 42 100 32 108 18" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M116 64 C122 52 118 42 122 30" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>