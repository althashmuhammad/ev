<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="mat-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mat-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="mat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="170" rx="72" ry="12" fill="#CBD5E0" opacity="0.6"/>
  <!-- 3D Contoured Floor Mat Base (Perspective View) -->
  <g filter="url(#mat-shadow)">
    <!-- Raised Outer Spill Rim -->
    <path d="M48 52 C54 42 146 42 152 52 L168 142 C170 156 160 162 146 162 L54 162 C40 162 30 156 32 142 Z" fill="url(#mat-rim)"/>
    <!-- Deep Dish Interior Basin -->
    <path d="M54 58 C58 50 142 50 146 58 L160 140 C161 150 153 154 142 154 L58 154 C47 154 39 150 40 140 Z" fill="url(#mat-surface)"/>
    <!-- Hexagonal Water-Trap Tread Pattern -->
    <g stroke="#475569" stroke-width="1.5" fill="#1E293B" opacity="0.8">
      <!-- Row 1 -->
      <polygon points="85,70 95,65 105,70 105,80 95,85 85,80"/>
      <polygon points="108,70 118,65 128,70 128,80 118,85 108,80"/>
      <polygon points="62,70 72,65 82,70 82,80 72,85 62,80"/>
      <!-- Row 2 -->
      <polygon points="73,86 83,81 93,86 93,96 83,101 73,96"/>
      <polygon points="96,86 106,81 116,86 116,96 106,101 96,96"/>
      <polygon points="119,86 129,81 139,86 139,96 129,101 119,96"/>
      <!-- Row 3 -->
      <polygon points="85,102 95,97 105,102 105,112 95,117 85,112"/>
      <polygon points="108,102 118,97 128,102 128,112 118,117 108,112"/>
      <polygon points="62,102 72,97 82,102 82,112 72,117 62,112"/>
    </g>
    <!-- Reinforced Driver Heel Pad -->
    <rect x="68" y="122" width="64" height="24" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1.2"/>
    <g stroke="#334155" stroke-width="1">
      <line x1="74" y1="126" x2="126" y2="126"/>
      <line x1="74" y1="130" x2="126" y2="130"/>
      <line x1="74" y1="134" x2="126" y2="134"/>
      <line x1="74" y1="138" x2="126" y2="138"/>
      <line x1="74" y1="142" x2="126" y2="142"/>
    </g>
    <!-- Metallic Nexon.ev Brand Emblem -->
    <rect x="82" y="130" width="36" height="8" rx="2" fill="#008B8D"/>
    <text x="100" y="136" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">NEXON.EV</text>
    <!-- Snap-in Floor Retention Grommets -->
    <circle cx="56" cy="146" r="4.5" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="56" cy="146" r="2.5" fill="#0F172A"/>
    <circle cx="144" cy="146" r="4.5" fill="#475569" stroke="#94A3B8" stroke-width="1"/>
    <circle cx="144" cy="146" r="2.5" fill="#0F172A"/>
  </g>
  <!-- Water Beading Droplets -->
  <circle cx="125" cy="74" r="3" fill="#38BDF8" opacity="0.9"/>
  <circle cx="78" cy="92" r="2.5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="138" cy="108" r="2" fill="#38BDF8" opacity="0.9"/>
</svg>