<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ss-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>
    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="174" rx="65" ry="9" fill="#CBD5E0" opacity="0.6"/>
  <!-- Umbrella Style Foldable Sunshade Expanded View -->
  <g filter="url(#ss-shadow)">
    <!-- Main Reflector Shield Contoured to Windshield -->
    <path d="M25 75 C45 60 155 60 175 75 L165 145 C150 155 50 155 35 145 Z" fill="url(#ss-silver)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Rearview Mirror Cutout at Top -->
    <path d="M90 65 C90 75 110 75 110 65 Z" fill="#1E293B"/>
    <!-- Titanium Accordion/Umbrella Ribs -->
    <g stroke="#64748B" stroke-width="1.2" opacity="0.7">
      <line x1="45" y1="72" x2="52" y2="148"/>
      <line x1="70" y1="67" x2="74" y2="152"/>
      <line x1="95" y1="75" x2="95" y2="153"/>
      <line x1="105" y1="75" x2="105" y2="153"/>
      <line x1="130" y1="67" x2="126" y2="152"/>
      <line x1="155" y1="72" x2="148" y2="148"/>
    </g>
    <!-- Center Umbrella Shaft Handle -->
    <rect x="97" y="135" width="6" height="32" rx="2" fill="#0F172A"/>
    <!-- Sunlight Reflection Beams -->
    <polygon points="120,68 155,75 130,120 115,85" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <!-- Sun Blocking Ray Shield Graphics -->
  <circle cx="160" cy="45" r="14" fill="#F59E0B" opacity="0.9"/>
  <path d="M160 25 L160 28 M160 62 L160 65 M140 45 L143 45 M177 45 L180 45 M146 31 L148 33 M172 57 L174 59 M146 59 L148 57 M172 31 L174 33" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="44" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#008B8D" text-anchor="middle" letter-spacing="0.5">BLOCKS 99% UV</text>
</svg>