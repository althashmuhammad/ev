<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="mf-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="mf-grey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="mf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="176" rx="65" ry="10" fill="#CBD5E0" opacity="0.6"/>
  <!-- Stack of 4 Folded Luxury Edgeless Microfiber Towels -->
  <g filter="url(#mf-shadow)">
    <!-- Layer 1 (Bottom Dark Slate) -->
    <path d="M38 140 C42 135 158 135 162 140 C166 148 156 160 148 162 L52 162 C44 160 34 148 38 140 Z" fill="url(#mf-grey)"/>
    <!-- Layer 2 (Teal) -->
    <path d="M42 120 C46 115 154 115 158 120 C162 128 152 140 144 142 L56 142 C48 140 38 128 42 120 Z" fill="url(#mf-teal)"/>
    <!-- Layer 3 (Dark Slate) -->
    <path d="M46 100 C50 95 150 95 154 100 C158 108 148 120 140 122 L60 122 C52 120 42 108 46 100 Z" fill="url(#mf-grey)"/>
    <!-- Layer 4 (Top Plush Teal) -->
    <path d="M50 80 C54 75 146 75 150 80 C154 88 144 100 136 102 L64 102 C56 100 46 88 50 80 Z" fill="url(#mf-teal)"/>
    <!-- Plush Fluffy Micro-Weave Pattern on Top Towel -->
    <g fill="#5EEAD4" opacity="0.6">
      <circle cx="70" cy="88" r="1.5"/><circle cx="85" cy="88" r="1.5"/><circle cx="100" cy="88" r="1.5"/><circle cx="115" cy="88" r="1.5"/><circle cx="130" cy="88" r="1.5"/>
      <circle cx="78" cy="94" r="1.5"/><circle cx="93" cy="94" r="1.5"/><circle cx="108" cy="94" r="1.5"/><circle cx="123" cy="94" r="1.5"/>
    </g>
    <!-- Ribbon Band Around Pack -->
    <rect x="92" y="75" width="16" height="88" fill="#005B63" opacity="0.9"/>
    <!-- 800 GSM Tag -->
    <rect x="85" y="110" width="30" height="12" rx="2.5" fill="#FFFFFF"/>
    <text x="100" y="118.5" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#008B8D" text-anchor="middle">800 GSM</text>
  </g>
  <text x="100" y="58" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#0F766E" text-anchor="middle">PACK OF 4</text>
</svg>