<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="org-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="org-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="174" rx="75" ry="12" fill="#CBD5E0" opacity="0.6"/>
  <g filter="url(#org-shadow)">
    <!-- 3D Isometric Caddy Box Base -->
    <path d="M30 85 L100 62 L170 85 L170 145 L100 168 L30 145 Z" fill="url(#org-body)"/>
    <!-- Left Compartment Top Opening -->
    <polygon points="30,85 100,62 100,105 30,128" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Right Compartment Top Opening -->
    <polygon points="100,62 170,85 170,128 100,105" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <!-- Center Partition Wall -->
    <line x1="100" y1="62" x2="100" y2="168" stroke="#008B8D" stroke-width="2.5"/>
    <!-- Center Thermal Cooler Foil Lid with Teal Zipper -->
    <polygon points="65,74 135,74 135,96 65,96" fill="#64748B" opacity="0.6"/>
    <line x1="65" y1="96" x2="135" y2="96" stroke="#14B8A6" stroke-width="2"/>
    <!-- Side Mesh Pockets with Bottles/Accessories -->
    <rect x="40" y="118" width="46" height="24" rx="2" fill="#0F172A" stroke="#475569" stroke-dasharray="4 2"/>
    <rect x="114" y="118" width="46" height="24" rx="2" fill="#0F172A" stroke="#475569" stroke-dasharray="4 2"/>
    <!-- Heavy-Duty Aluminum Handles -->
    <ellipse cx="32" cy="115" rx="3" ry="8" fill="#CBD5E0" stroke="#475569"/>
    <ellipse cx="168" cy="115" rx="3" ry="8" fill="#CBD5E0" stroke="#475569"/>
    <!-- 60L High Capacity Badge -->
    <rect x="88" y="132" width="24" height="9" rx="2" fill="#008B8D"/>
    <text x="100" y="138.5" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle">60L BOOT</text>
  </g>
</svg>