<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Apply saved / system theme before first paint -->
  <script>
    (function () {
      var themes = ['light', 'dark', 'mono-dark', 'mono-light', 'neon', 'ocean', 'forest', 'graphite', 'custom'];
      var defaults = { page: '#F6F8F7', surface: '#FFFFFF', text: '#131B1E', accent: '#005C68' };
      try {
        var t = localStorage.getItem('voltindia-teal-theme');
        if (themes.indexOf(t) < 0) t = 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'custom') {
          var saved = JSON.parse(localStorage.getItem('voltindia-custom-theme') || '{}');
          Object.keys(defaults).forEach(function (key) {
            var value = typeof saved[key] === 'string' && /^#[0-9a-f]{6}$/i.test(saved[key]) ? saved[key] : defaults[key];
            var cssName = key === 'text' ? 'label' : key === 'accent' ? 'teal' : key;
            document.documentElement.style.setProperty('--' + cssName, value);
          });
          var root = document.documentElement;
          var page = root.style.getPropertyValue('--page');
          var surface = root.style.getPropertyValue('--surface');
          var text = root.style.getPropertyValue('--label');
          var accent = root.style.getPropertyValue('--teal');
          root.style.setProperty('--fill', 'color-mix(in srgb, ' + page + ' 94%, ' + text + ')');
          root.style.setProperty('--fill2', 'color-mix(in srgb, ' + page + ' 88%, ' + text + ')');
          root.style.setProperty('--label2', 'color-mix(in srgb, ' + text + ' 68%, ' + page + ')');
          root.style.setProperty('--label3', 'color-mix(in srgb, ' + text + ' 54%, ' + page + ')');
          root.style.setProperty('--line', 'color-mix(in srgb, ' + text + ' 12%, transparent)');
          root.style.setProperty('--teal-soft', 'color-mix(in srgb, ' + accent + ' 12%, ' + page + ')');
          root.style.setProperty('--teal-soft2', 'color-mix(in srgb, ' + accent + ' 22%, ' + page + ')');
          root.style.setProperty('--teal-dark', 'color-mix(in srgb, ' + accent + ' 78%, ' + text + ')');
          root.style.setProperty('--map-bg', 'color-mix(in srgb, ' + page + ' 92%, ' + surface + ')');
          root.style.setProperty('--map-road', surface);
          root.style.setProperty('--map-road2', 'var(--fill2)');
          root.style.setProperty('--body-bg', page);
          root.style.setProperty('--inv', accent);
          root.style.setProperty('--segon', accent);
          var rgb = accent.slice(1).match(/.{2}/g).map(function (part) { return parseInt(part, 16) / 255; });
          var luminance = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]);
          root.style.setProperty('--invtext', luminance > 0.55 ? '#000000' : '#FFFFFF');
          var textRgb = text.slice(1).match(/.{2}/g).map(function (part) { return parseInt(part, 16) / 255; });
          var textLuminance = 0.2126 * textRgb[0] + 0.7152 * textRgb[1] + 0.0722 * textRgb[2];
          root.style.setProperty('--home-vehicle-text', textLuminance > 0.55 ? '#000000' : '#FFFFFF');
        }
      } catch (error) {
        console.error('Unable to apply saved theme before first paint', error);
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          },
          colors: {
            page: 'color-mix(in srgb, var(--page) calc(<alpha-value> * 100%), transparent)',
            surface: 'color-mix(in srgb, var(--surface) calc(<alpha-value> * 100%), transparent)',
            fill: 'color-mix(in srgb, var(--fill) calc(<alpha-value> * 100%), transparent)',
            fill2: 'color-mix(in srgb, var(--fill2) calc(<alpha-value> * 100%), transparent)',
            label: 'color-mix(in srgb, var(--label) calc(<alpha-value> * 100%), transparent)',
            label2: 'color-mix(in srgb, var(--label2) calc(<alpha-value> * 100%), transparent)',
            label3: 'color-mix(in srgb, var(--text-color-disabled) calc(<alpha-value> * 100%), transparent)',
            line: 'color-mix(in srgb, var(--line) calc(<alpha-value> * 100%), transparent)',
            teal: 'color-mix(in srgb, var(--teal) calc(<alpha-value> * 100%), transparent)',
            'teal-dark': 'color-mix(in srgb, var(--teal-dark) calc(<alpha-value> * 100%), transparent)',
            'teal-soft': 'color-mix(in srgb, var(--teal-soft) calc(<alpha-value> * 100%), transparent)',
            'teal-soft2': 'color-mix(in srgb, var(--teal-soft2) calc(<alpha-value> * 100%), transparent)',
            slatecard: 'color-mix(in srgb, var(--slatecard) calc(<alpha-value> * 100%), transparent)',
            coral: 'color-mix(in srgb, var(--coral) calc(<alpha-value> * 100%), transparent)',
            inv: 'color-mix(in srgb, var(--inv) calc(<alpha-value> * 100%), transparent)',
            invtext: 'color-mix(in srgb, var(--invtext) calc(<alpha-value> * 100%), transparent)',
            inv2: 'color-mix(in srgb, var(--inv2) calc(<alpha-value> * 100%), transparent)',
            invfill: 'color-mix(in srgb, var(--invfill) calc(<alpha-value> * 100%), transparent)'
          }
        }
      }
    };
  </script>

    /* =====================================================================

    * {

    .secondary-copy { font-size: var(--font-size-secondary); line-height: 1.4; color: var(--text-color-secondary); }
    .caption-copy { font-size: var(--text-caption); line-height: 1.35; }

    /* =====================================================================
       DEVICE FRAME — Fullscreen on mobile phones, centered device on desktop
       ===================================================================== */
    .iphone {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      position: relative;
      flex-shrink: 0;
      background: var(--page);
      transition: background 0.3s ease;

    .ios-screen {
      width: 100%;
      height: 100%;

        border-radius: 58px;

        left: -3.5px;
        top: 138px;
        width: 3px;
        height: 30px;
        background: var(--chassis-btn);
        border-radius: 3px 0 0 3px;
        box-shadow: 0 50px 0 var(--chassis-btn), 0 105px 0 var(--chassis-btn);
      }
      .iphone::after {
        content: '';
        position: absolute;
        right: -3.5px;
        top: 195px;
        width: 3px;
        height: 86px;
        background: var(--chassis-btn);
        border-radius: 0 3px 3px 0;
      }
      .ios-screen {
        border-radius: 47px;
      }

    body.is-fullscreen {
      padding: 0 !important;
      background: var(--page) !important;
    }
    body.is-fullscreen .iphone {
      width: 100vw !important;

    .ios-modal-enter {
      animation: iosModalFadeIn var(--motion-modal) var(--motion-spring) both;
    }
    .ios-backdrop-enter {
      animation: iosBackdropIn var(--motion-small) var(--motion-ease-out) both;
    }
    .ios-modal-exit { animation: iosModalFadeOut var(--motion-small) var(--motion-ease-in) both; }
    #ios-sheet-backdrop.is-closing { pointer-events: none; animation: iosBackdropOut var(--motion-small) var(--motion-ease-in) both; }
    #ios-sheet-backdrop.is-closing #ios-sheet-body { animation: iosSheetDown var(--motion-small) var(--motion-ease-in) both; }

    /* Subtle staggered entrance for cards & list items inside screens */
    .ios-stagger > * {
      animation: iosCardStagger var(--motion-card) var(--motion-ease-out) both;
    }
    .ios-stagger > *:nth-child(1) { animation-delay: 0.02s; }
    .ios-stagger > *:nth-child(2) { animation-delay: 0.055s; }
    .ios-stagger > *:nth-child(3) { animation-delay: 0.09s; }
    .ios-stagger > *:nth-child(4) { animation-delay: 0.125s; }
    .ios-stagger > *:nth-child(5) { animation-delay: 0.16s; }
    .ios-stagger > *:nth-child(6) { animation-delay: 0.195s; }

    /* Tactile Apple-style press & spring hover */
    .press, .btn, .btn-outline, .opt, .card {
      transition: transform var(--motion-button) var(--motion-ease-out), background-color var(--motion-small) var(--motion-ease-out), box-shadow var(--motion-small) var(--motion-ease-out), border-color var(--motion-small) var(--motion-ease-out), opacity var(--motion-small) var(--motion-ease-out);
    }
    .press:active, .btn:active, .btn-outline:active, .opt:active {
      transform: scale(0.975);
    }

    #ios-banner {
      opacity: 0;
      transform: translate3d(0, -24px, 0) scale(0.94);
      pointer-events: none;
      transition: transform var(--motion-modal) var(--motion-spring), opacity var(--motion-modal) var(--motion-ease-out);
    }
    #ios-banner.show {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }
    #ios-viewport { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { #ios-viewport { scroll-behavior: auto !important; } }
    #ios-tab-bar button { border-radius: 14px; transition: color var(--motion-small) var(--motion-ease-out), background-color var(--motion-small) var(--motion-ease-out), transform var(--motion-button) var(--motion-ease-out); }
    #ios-tab-bar button[aria-current="page"] { background: color-mix(in srgb, var(--accent-primary) 10%, transparent); }
    #ios-tab-bar button svg { transition: transform var(--motion-icon) var(--motion-ease-out); }
    #ios-tab-bar.home-liquid-tabs {
      margin: 0 10px 8px; padding: 5px 6px max(5px, env(safe-area-inset-bottom, 0px)) !important;
      border: 1px solid rgba(255,255,255,.82) !important; border-radius: 25px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
      box-shadow: 0 10px 26px rgba(0, 68, 78, .12), inset 0 1px 0 rgba(255,255,255,.86);
      backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
    }
    #ios-tab-bar.home-liquid-tabs button { min-width: 0; border-radius: 18px; }
    #ios-tab-bar.home-liquid-tabs button[aria-current="page"] {
      background: radial-gradient(ellipse at 50% 35%, rgba(52,211,193,.22), rgba(17,148,136,.08));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 4px 12px rgba(0,105,108,.08);
    }
    #ios-tab-bar.home-liquid-tabs button span { white-space: nowrap; font-size: 9.5px; }
    .icon-btn svg { transition: transform var(--motion-icon) var(--motion-ease-out); }
    .icon-btn:active svg { transform: scale(0.9); }
    .seg button, .sw, .sw::before, .sw i, .opt { transition-duration: var(--motion-small); transition-timing-function: var(--motion-ease-out); }
    .field-error { animation: iosTabFade var(--motion-small) var(--motion-ease-out) both; }
    @media (prefers-reduced-transparency: reduce) {
      .glass, #ios-sheet-backdrop { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    }

    /* =====================================================================
       UX / A11Y FIXES
       ===================================================================== */
    /* Utilities used in markup that Tailwind v3 CDN does not ship */
    .shadow-xs { box-shadow: 0 1px 3px rgba(0, 40, 48, 0.08); }
    .backdrop-blur-xs { backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }

    /* Visible keyboard focus (tap highlight was removed globally) */
    #ios-sheet-backdrop:focus { outline: none; }
    button:focus-visible, [role="button"]:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2.5px solid var(--teal); outline-offset: 2px;
    }

    /* Legibility floor: nothing smaller than 10px on a phone */
    .text-\[5px\], .text-\[6px\], .text-\[8px\], .text-\[8\.5px\], .text-\[9px\], .text-\[9\.5px\] { font-size: 10px !important; }
    .ev-plate-ind span { font-size: 6px !important; }

    /* Dark mode: teal used as TEXT needs a lighter tint to stay readable (≥4.5:1) */
    :root[data-theme="dark"] .text-teal,
    :root[data-theme="dark"] .opt.on,
    :root[data-theme="dark"] .chip:not(.chip-inv):not(.chip-neutral),
    :root[data-theme="dark"] .btn-outline { color: #6FD0DB !important; }
    :root[data-theme="dark"] .opt.on .text-teal { color: #6FD0DB !important; }
    :root[data-theme="dark"] .bg-teal .text-teal, :root[data-theme="dark"] .bg-teal.text-teal { color: #fff !important; }
    :root[data-theme="dark"] .bg-white.text-teal { color: #005C68 !important; }

    /* Disabled CTA */
    .btn[disabled], .btn.is-disabled { background: var(--fill2); color: var(--text-color-disabled); box-shadow: none; cursor: not-allowed; }

    /* Form validation */
    .field-error { font-size: 11px; color: var(--coral); margin-top: 4px; font-weight: 600; }
    .input-invalid { border-color: var(--coral) !important; }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

    function updateHomeBatteryReadout(soc, vehicle) {
      const rangeKm = Math.round((soc / 100) * vehicle.batteryKwh * 8.1);

      const fill = document.getElementById('home-battery-level');

      if (fill) fill.setAttribute('width', ((14 * soc) / 100).toFixed(2));
      if (button) button.setAttribute('aria-label', `Battery ${soc} percent, estimated ${rangeKm} kilometres range`);

    function updateDemoBatteryNotification(vehicle) {

      if (!batteryNotice) return;
      batteryNotice.title = `Emergency Battery Alert (${vehicle.soc}%)`;
      batteryNotice.body = `${vehicle.short || vehicle.name} has ~${rangeKm} km estimated range left. Tap to Quick Charge.`;
      batteryNotice.time = 'Now';
    }

    function scheduleDemoBatteryCue() {
      if (state.entryMode !== 'demo' || state.screen !== '01' || demoBatteryCueCompleted || demoBatteryTransitionRunning || demoBatteryCueTimer !== null) return;
      const vehicle = car();
      if (!Number.isFinite(vehicle.soc) || vehicle.soc <= 15) return;
      const initialSoc = vehicle.soc;
      demoBatteryCueTimer = window.setTimeout(() => {
        demoBatteryCueTimer = null;
        if (state.entryMode !== 'demo' || state.screen !== '01' || car() !== vehicle) return;
        demoBatteryTransitionRunning = true;
        demoBatteryCueVehicle = vehicle;
        const startTime = performance.now();
        const animateBattery = (now) => {
          const progress = Math.min((now - startTime) / 1200, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          vehicle.soc = Math.round(initialSoc + (15 - initialSoc) * eased);
          updateHomeBatteryReadout(vehicle.soc, vehicle);
          if (progress < 1) {
            demoBatteryAnimationFrame = window.requestAnimationFrame(animateBattery);
            return;
          }
          vehicle.soc = 15;
          demoBatteryTransitionRunning = false;
          demoBatteryAnimationFrame = null;
          demoBatteryCueCompleted = true;
          if (state.entryMode !== 'demo' || state.screen !== '01' || car() !== vehicle) return;
          updateDemoBatteryNotification(vehicle);
          state.demoBatteryAlertAnimating = true;
          render();
          demoBatteryAlertResetTimer = window.setTimeout(() => {
            state.demoBatteryAlertAnimating = false;
            demoBatteryAlertResetTimer = null;
            if (state.screen === '01') render();
          }, 720);
        };
        demoBatteryAnimationFrame = window.requestAnimationFrame(animateBattery);
      }, 5000);
    }

    // go(id)              → push a screen (remembers where we came from)
    // go(id, 'pop')       → animate as going back
    // go(id, dir, {reset}) → start a fresh stack (used after a booking is confirmed, so Back never re-enters a finished checkout)
    function go(id, explicitDir, opts = {}) {
      if (id !== '01' && demoBatteryCueTimer !== null) {
        window.clearTimeout(demoBatteryCueTimer);
        demoBatteryCueTimer = null;
      }
      if (id !== '01' && demoBatteryTransitionRunning) {
        if (demoBatteryAnimationFrame !== null) window.cancelAnimationFrame(demoBatteryAnimationFrame);
        demoBatteryAnimationFrame = null;
        if (demoBatteryCueVehicle) {
          demoBatteryCueVehicle.soc = 15;
          updateDemoBatteryNotification(demoBatteryCueVehicle);
        }
        demoBatteryTransitionRunning = false;
        demoBatteryCueCompleted = true;
      }
      const prevDepth = SCREEN_DEPTH[state.screen] ?? 0;
      const nextDepth = SCREEN_DEPTH[id] ?? 0;
      if (explicitDir) {
        state.navDirection = explicitDir;
      } else if (prevDepth === 0 && nextDepth === 0 && state.screen !== id) {
        state.navDirection = 'tab';
      } else if (nextDepth >= prevDepth) {
        state.navDirection = 'push';
      } else {
        state.navDirection = 'pop';
      }
      if (Array.isArray(opts.history)) {
        state.history = opts.history.slice();
      } else if (opts.reset || nextDepth === 0) {
        state.history = nextDepth === 0 ? [] : ['01'];
      } else if (explicitDir !== 'pop' && state.screen !== id) {
        state.history.push(state.screen);
      }
      state.screen = id;
      if (id === '10') { state.addSuccessVehicle = null; state.addErrors = {}; }
      closeSheet();
      render(true);
      const vp = document.getElementById('ios-viewport');
      if (vp) vp.scrollTop = 0;
      if (id === '01') scheduleDemoBatteryCue();
    }

    const CUSTOM_THEME_PROPERTIES = [

      '--teal', '--teal-dark', '--teal-soft', '--teal-soft2', '--slatecard', '--inv', '--invtext',

      '--body-bg', '--chassis', '--chassis-ring', '--chassis-inner', '--chassis-btn'

    function applyCustomTheme() {
      const { page, surface, text, accent } = state.customTheme;
      const rgb = accent.slice(1).match(/.{2}/g).map(part => parseInt(part, 16) / 255);
      const accentText = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2] > 0.55 ? '#000000' : '#FFFFFF';
      const textRgb = text.slice(1).match(/.{2}/g).map(part => parseInt(part, 16) / 255);
      const vehicleText = 0.2126 * textRgb[0] + 0.7152 * textRgb[1] + 0.0722 * textRgb[2] > 0.55 ? '#000000' : '#FFFFFF';
      const root = document.documentElement;
      const values = {
        '--page': page, '--surface': surface, '--label': text, '--teal': accent,
        '--fill': `color-mix(in srgb, ${page} 94%, ${text})`,
        '--fill2': `color-mix(in srgb, ${page} 88%, ${text})`,
        '--label2': `color-mix(in srgb, ${text} 68%, ${page})`,
        '--label3': `color-mix(in srgb, ${text} 54%, ${page})`,
        '--line': `color-mix(in srgb, ${text} 12%, transparent)`,
        '--teal-dark': `color-mix(in srgb, ${accent} 78%, ${text})`,
        '--teal-soft': `color-mix(in srgb, ${accent} 12%, ${page})`,
        '--teal-soft2': `color-mix(in srgb, ${accent} 22%, ${page})`,
        '--slatecard': `color-mix(in srgb, ${text} 90%, ${page})`,
        '--inv': accent, '--invtext': accentText, '--segon': accent,
        '--home-vehicle-text': vehicleText,
        '--glass': `color-mix(in srgb, ${surface} 90%, transparent)`,
        '--map-bg': `color-mix(in srgb, ${page} 92%, ${surface})`,
        '--map-road': surface, '--map-road2': 'var(--fill2)',
        '--map-water': `color-mix(in srgb, ${page} 88%, ${accent})`,
        '--map-park': `color-mix(in srgb, ${page} 92%, #10B981)`,
        '--body-bg': page, '--chassis': `color-mix(in srgb, ${page} 84%, ${text})`,
        '--chassis-ring': `color-mix(in srgb, ${text} 18%, ${page})`,
        '--chassis-inner': page, '--chassis-btn': `color-mix(in srgb, ${text} 30%, ${page})`
      };
      Object.entries(values).forEach(([name, value]) => root.style.setProperty(name, value));
    }
    function persistThemePreference(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;

        console.error('Unable to save theme preference', error);
        showBanner('Theme change could not be saved');
        return false;
      }
    }
    function setTheme(t) {
      if (!THEME_OPTIONS.some(option => option.id === t)) throw new RangeError(`Unknown theme: ${t}`);
      state.theme = t;
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'custom') applyCustomTheme();
      else CUSTOM_THEME_PROPERTIES.forEach(name => document.documentElement.style.removeProperty(name));
      render();
      persistThemePreference('voltindia-teal-theme', t);
    }
    function updateCustomThemeColor(key, value) {
      if (!Object.prototype.hasOwnProperty.call(DEFAULT_CUSTOM_THEME, key) || !/^#[0-9a-f]{6}$/i.test(value)) {

      }
      state.customTheme[key] = value.toUpperCase();
      if (state.theme === 'custom') applyCustomTheme();
      persistThemePreference('voltindia-custom-theme', JSON.stringify(state.customTheme));
      const preview = document.querySelector('[data-theme-option="custom"] .theme-preview');
      if (preview) {

    let bannerTimer = null;

    let sheetReturnFocus = null;

    function openSheet(html) {
      const bd = document.getElementById('ios-sheet-backdrop');
      if (bd.style.display !== 'flex') sheetReturnFocus = document.activeElement;
      if (sheetCloseTimer !== null) { clearTimeout(sheetCloseTimer); sheetCloseTimer = null; }
      const body = document.getElementById('ios-sheet-body');
      const content = document.getElementById('ios-sheet-content');
      bd.classList.remove('is-closing');
      body.style.transform = '';
      body.style.transition = '';
      content.innerHTML = html;
      const sheetSurface = content.querySelector('.bg-surface, .card, .sheet') || content.firstElementChild;
      if (sheetSurface) sheetSurface.prepend(sheetDragHandle);
      else content.appendChild(sheetDragHandle);
      bd.style.display = 'flex';
      bd.classList.remove('ios-backdrop-enter');
      content.classList.remove('rise');
      void bd.offsetWidth;
      void content.offsetWidth;
      bd.classList.add('ios-backdrop-enter');
      content.classList.add('rise');
      bd.setAttribute('role', 'dialog');
      bd.setAttribute('aria-modal', 'true');
      // Focus the dialog itself (screen readers announce it; no stray focus ring on touch)
      bd.setAttribute('tabindex', '-1');
      bd.focus({ preventScroll: true });
    }
    function closeSheet() {
      const bd = document.getElementById('ios-sheet-backdrop');
      if (!bd || bd.style.display === 'none' || bd.classList.contains('is-closing')) return;
      const body = document.getElementById('ios-sheet-body');
      document.getElementById('ios-sheet-content').classList.remove('rise');
      const finishClose = () => {
        bd.style.display = 'none';
        bd.classList.remove('is-closing');
        body.style.transform = '';
        body.style.transition = '';
        if (sheetReturnFocus && document.contains(sheetReturnFocus)) sheetReturnFocus.focus({ preventScroll: true });
        sheetReturnFocus = null;
        sheetCloseTimer = null;
      };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finishClose();
        return;
      }
      bd.classList.add('is-closing');
      sheetCloseTimer = setTimeout(finishClose, 220);
    }
    const sheetDragHandle = document.getElementById('ios-sheet-drag-handle');
    const sheetBody = document.getElementById('ios-sheet-body');
    let sheetDrag = null;
    let suppressSheetHandleClick = false;
    sheetDragHandle.addEventListener('click', (event) => {
      if (suppressSheetHandleClick) { event.preventDefault(); suppressSheetHandleClick = false; return; }
      closeSheet();
    });
    sheetDragHandle.addEventListener('pointerdown', (event) => {
      if (document.getElementById('ios-sheet-backdrop').style.display !== 'flex' ||
          document.getElementById('ios-sheet-backdrop').classList.contains('is-closing') ||
          (event.pointerType === 'mouse' && event.button !== 0)) return;
      sheetDrag = { pointerId: event.pointerId, startY: event.clientY, distance: 0 };
      sheetBody.style.transition = 'none';
      sheetDragHandle.setPointerCapture(event.pointerId);
    });
    sheetDragHandle.addEventListener('pointermove', (event) => {
      if (!sheetDrag || event.pointerId !== sheetDrag.pointerId) return;
      sheetDrag.distance = Math.max(0, event.clientY - sheetDrag.startY);
      sheetBody.style.transform = `translate3d(0, ${sheetDrag.distance}px, 0)`;
    });
    sheetDragHandle.addEventListener('pointerup', (event) => {
      if (!sheetDrag || event.pointerId !== sheetDrag.pointerId) return;
      const distance = sheetDrag.distance;
      sheetDrag = null;
      if (distance > 6) {
        suppressSheetHandleClick = true;
        setTimeout(() => { suppressSheetHandleClick = false; }, 0);
      }
      if (distance >= 90) { closeSheet(); return; }
      sheetBody.style.transition = `transform var(--motion-small) var(--motion-ease-out)`;
      sheetBody.style.transform = '';
      setTimeout(() => { sheetBody.style.transition = ''; }, 220);
    });
    sheetDragHandle.addEventListener('pointercancel', () => {
      sheetDrag = null;
      sheetBody.style.transition = `transform var(--motion-small) var(--motion-ease-out)`;
      sheetBody.style.transform = '';
      setTimeout(() => { sheetBody.style.transition = ''; }, 220);
    });
    const overlayCloseTimers = new WeakMap();
    function showAnimatedOverlay(element) {
      const timer = overlayCloseTimers.get(element);
      if (timer) { clearTimeout(timer); overlayCloseTimers.delete(element); }
      element.classList.remove('ios-modal-exit');
      element.style.display = 'flex';
      element.classList.remove('ios-modal-enter');
      void element.offsetWidth;
      element.classList.add('ios-modal-enter');
    }
    function hideAnimatedOverlay(element) {
      if (!element || element.style.display === 'none' || element.classList.contains('ios-modal-exit')) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        element.style.display = 'none';
        element.classList.remove('ios-modal-enter', 'ios-modal-exit');
        return;
      }
      element.classList.remove('ios-modal-enter');
      element.classList.add('ios-modal-exit');
      const timer = setTimeout(() => {
        if (element.classList.contains('ios-modal-exit')) {
          element.style.display = 'none';
          element.classList.remove('ios-modal-exit');
        }
        overlayCloseTimers.delete(element);
      }, 220);
      overlayCloseTimers.set(element, timer);
    }
    // Escape closes the top-most layer (sheet → chat → call)
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('ios-sheet-backdrop').style.display === 'flex') return closeSheet();
      if (document.getElementById('ios-chat-overlay').style.display === 'flex') return closeLiveChat();
      if (state.callActive) return closeVoiceCall();

    // =====================================================================
    // ORDERS — one place that turns any confirmed checkout into either a live
    // dispatch (→ tracking) or a future booking (→ Activity › Scheduled)
    // =====================================================================
    function makeActiveOrder(o) {
      return {
        id: o.id, title: o.title, serviceType: o.serviceType, detail: o.detail,
        status: o.status || 'En Route',
        boostLabel: o.detail, etaMins: o.etaMins, paymentMode: o.paymentMode || 'Postpayment',
        paymentMethod: o.paymentMethod || state.pay, total: o.total || 0, cancelled: false,
        customerTest: !!o.customerTest, chargingMins: o.chargingMins || null,
        locationLabel: o.locationLabel || state.locationFull || state.locationTitle,
        vehicleName: o.vehicleName || car().name,
        vehiclePlate: o.vehiclePlate || car().plate,
        requestedAt: o.requestedAt || new Date().toISOString()
      };
    }
    function placeOrder(o) {
      const customerTest = state.entryMode === 'customer';
      if (customerTest) {
        state.customerOrderSeq += 1;
        o = {
          ...o,
          id: `TEST-${String(state.customerOrderSeq).padStart(3, '0')}`,
          status: 'Charge request received',
          paymentMode: 'No payment',
          customerTest: true,
          requestedAt: new Date().toISOString()
        };
      }
      const paymentMethod = o.paymentMethod || state.pay;
      if (!customerTest && !o.scheduledLabel && o.paymentMode === 'Prepayment' && paymentMethod === 'wallet') {
        if (state.walletInr < o.total) {
          showBanner(`Wallet has ₹${state.walletInr.toLocaleString('en-IN')} — top up or pick UPI`);
          return openPayMethodSheet();
        }
        state.walletInr -= o.total;
      }
      if (o.scheduledLabel) {
        state.scheduledOrder = {
          active: true, serviceType: o.serviceType, title: o.title, detail: o.detail,
          timeLabel: o.scheduledLabel, locationLabel: state.locationTitle, progressStep: 1,
          customerTest, id: o.id
        };
        if (customerTest) state.customerOrders.unshift({ ...o, scheduled: true, cancelled: false });
        state.activityTab = 'Scheduled';
        go('08', 'tab', { reset: true });
        showBanner(customerTest
          ? `Local test schedule saved • ${o.scheduledLabel}; no provider contacted`
          : `${o.title} scheduled • ${o.scheduledLabel}`);
        return;
      }
      state.activeOrder = makeActiveOrder({ ...o, paymentMethod });
      if (customerTest) state.customerOrders.unshift(state.activeOrder);
      resetChat();
      go('03', 'push', { reset: true });
      showBanner(customerTest
        ? `Charge request received • ETA estimate ${o.etaMins} min; not dispatched`
        : `${o.title} confirmed • ETA ${o.etaMins} min`);
    }
    function cancelActiveOrder() {
      const o = state.activeOrder;
      if (!o || o.cancelled) return;
      if (state.entryMode !== 'customer' && o.paymentMode === 'Prepayment' && o.paymentMethod === 'wallet' && o.total) state.walletInr += o.total;
      o.cancelled = true;
      o.status = state.entryMode === 'customer' ? 'Charge request cancelled' : o.status;
      go('01', 'pop');
      showBanner(state.entryMode === 'customer' ? 'Charge request cancelled' : o.paymentMode === 'Prepayment' ? 'Request cancelled • refund initiated' : 'Request cancelled');
    }
    function askCancelActiveOrder() {
      confirmSheet({
        title: 'Cancel this request?',
        body: state.entryMode === 'customer'
          ? `${esc(state.activeOrder.boostLabel)} • cancel this charge request? No service provider was contacted.`
          : `${esc(state.activeOrder.boostLabel)} • crew is ${state.activeOrder.etaMins} min away.${state.activeOrder.paymentMode === 'Prepayment' ? ' Your prepayment will be refunded.' : ''}`,
        confirmLabel: 'Yes, cancel request',
        confirmFn: 'cancelActiveOrder()'
      });
    }
    function askCancelScheduled() {
      confirmSheet({
        title: 'Cancel scheduled booking?',
        body: state.entryMode === 'customer'
          ? 'Remove this charging schedule? No service provider was contacted.'
          : `${esc(state.scheduledOrder.title)} • ${esc(state.scheduledOrder.timeLabel)}`,
        confirmLabel: 'Yes, cancel booking',
        confirmFn: 'cancelScheduledOrder()'
      });
    }
    function cancelScheduledOrder() {
      if (!state.scheduledOrder || !state.scheduledOrder.active) return;
      state.scheduledOrder.active = false;
      if (state.entryMode === 'customer') {
        const request = state.customerOrders.find(order => order.id === state.scheduledOrder.id);
        if (request) request.status = 'Schedule cancelled';
      }
      render();
      showBanner(state.entryMode === 'customer' ? 'Charging schedule cancelled' : 'Scheduled booking cancelled');
    }
    function completeCustomerTestOrder() {
      const order = state.activeOrder;
      if (state.entryMode !== 'customer' || !order || order.cancelled) return;
      order.status = 'Charging flow completed';
      order.completedAt = new Date().toISOString();
      state.activeOrder = null;
      state.activityTab = 'Recent';
      go('08', 'tab', { reset: true });
      showBanner('Charging flow completed');
    }
    function hasLiveOrder() { return !!state.activeOrder && !state.activeOrder.cancelled; }
    // Notification / deep-link routing that never shows a dead screen
    function openTarget(target) {
      if (target === '03' && !hasLiveOrder()) return go('08');
      if (target === '02') return startCharge('Emergency');
      go(target);
    }

    // Arrival-time choices depend on the service and on the booking mode
    function arrivalSlots(etaMins, { allowLater = true, mode = 'Now' } = {}) {
      const customerTest = state.entryMode === 'customer';
      if (customerTest && mode === 'Schedule') return SLOTS.map(label => ({ label, sub: 'Local test only', later: true }));
      if (customerTest && mode === 'Recurring') return ['7:00 AM', '9:00 AM', '9:00 PM'].map(label => ({ label, sub: 'Local test only', later: true }));
      if (customerTest) {
        return [
          { label: 'As soon as possible', sub: 'Local test preference', eta: etaMins },
          { label: 'Later today', sub: 'Local test preference', eta: 45 }
        ];
      }
      const isPre = state.paymentMode === 'Prepayment';
      if (mode === 'Schedule') return SLOTS.map(s => ({ label: s, sub: 'Scheduled', later: true }));
      if (mode === 'Recurring') return ['7:00 AM', '9:00 AM', '9:00 PM'].map(t => ({ label: t, sub: 'Every selected day', later: true }));
      const now = [
        { label: `${isPre ? 'Express' : 'Standard'} (~${etaMins} min)`, sub: isPre ? 'Priority' : 'Normal queue', eta: etaMins },
        { label: 'In 45 mins', sub: 'Today', eta: 45 }
      ];
      return allowLater ? [...now, { label: 'Tomorrow 9 AM', sub: 'Scheduled', later: true }] : now;
    }
    function currentSlot(slots) {
      let s = slots.find(x => x.label === state.serviceArrivalSlot);
      if (!s) { s = slots[0]; state.serviceArrivalSlot = s.label; }
      return s;
    }
    function recurLabel(time) {
      const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      return state.recurDays.map(i => names[i]).join(', ') + ' • ' + time;
    }
    // CTA wording tells the user exactly what will happen when they tap
    function ctaLabel(total, slot, verb = 'book') {
      if (state.entryMode === 'customer') return slot.later ? 'Save schedule' : 'Request charging';
      if (slot.later) return 'Confirm schedule';
      return state.paymentMode === 'Prepayment' ? `Pay ₹${total.toLocaleString('en-IN')} & ${verb}` : `Confirm • pay later`;
    }

          `On my way to ${state.locationTitle.split(' •')[0]}. Will call as soon as I pull up!`

    // =====================================================================
    // SHARED REUSABLE UI HELPERS FOR MULTI-STEP FLOWS

    function flowJumpToStep(screenId, sNum) {
      const k = STEP_KEY[screenId];
      if (k) {
        if (screenId === '02' && sNum > state[k]) return;
        state[k] = sNum;
        render(true);
        const vp = document.getElementById('ios-viewport');
        if (vp) vp.scrollTop = 0;
      }
    }

    function renderStepBar(step, labels) {
      const stepItems = (labels && labels.length ? labels : ['Location', 'Charger', 'Time & pay'])
        .map((label, index) => ({ num: index + 1, label }));
      const compact = stepItems.some(item => item.label.length > 9);
      const shortLabels = { 'Issue & truck': 'Issue', 'Time & pay': 'Time' };
      return `
      <div class="flow-stepper ${compact ? 'flow-stepper--compact' : ''}" role="group" aria-label="${state.screen === '02' ? 'Charging booking steps' : 'Checkout steps'}">
        ${stepItems.map((item, idx) => {
          const sNum = item.num;
          const active = step === sNum;
          const done = step > sNum;
          const locked = state.screen === '02' && sNum > step;
          const isLast = idx === stepItems.length - 1;

          return `
          <button ${locked ? 'disabled' : ''} ${active ? 'aria-current="step"' : ''} data-complete="${done}" aria-label="Step ${sNum}: ${item.label}" onclick="flowJumpToStep('${state.screen}', ${sNum})" class="flow-step-item press ${locked ? 'cursor-not-allowed' : ''}">
            <span class="flow-step-number">${done ? '✓' : sNum}</span>
            <span class="flow-step-label"><span class="flow-step-label-full">${item.label}</span><span class="flow-step-label-short" aria-hidden="true">${shortLabels[item.label] || item.label}</span></span>
          </button>
          ${!isLast ? `<span class="flow-step-separator ${done ? 'is-complete' : ''}" aria-hidden="true"></span>` : ''}
          `;
        }).join('')}
      </div>`;
    }

      state.homeMoreExpanded = !state.homeMoreExpanded;
      const expanded = state.homeMoreExpanded;
      panel.style.maxHeight = expanded ? `${panel.scrollHeight}px` : '0px';
      panel.classList.toggle('is-expanded', expanded);
      panel.setAttribute('aria-hidden', String(!expanded));
      panel.inert = !expanded;

    const KWH_OPTIONS = [15, 25, 35, 50];
    const MIN_CHARGE = 300;
    function chargeQuote() {
      const kwh = KWH_OPTIONS.includes(state.pickKwh) ? state.pickKwh : 25;
      const customerTest = state.entryMode === 'customer';
      const unitPrice = customerTest ? null : KW_PRICE[state.selectedKwSpeed] || 20;

    // 13 — MOBILE CARWASH (Location → Package → Time & pay)

    // 04 — STATIONS NEAR KOCHI (search + filters actually filter)

      const t = new Date(Date.now() + 15 * 60000);
      state.reservation = { hub: h.name, gun: g.name.split(' (')[0], until: t.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) };

      showBanner(`${state.reservation.gun} held for 15 min at ${h.operator}`);

    function quickFill(i) {
      const m = POPULAR_EVS[i];

      render();

    function normalisePlate(p) {
      const compact = p.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const bharatSeries = compact.match(/^(\d{2})BH(\d{4})([A-Z]{1,2})$/);
      if (bharatSeries) return `${bharatSeries[1]} BH ${bharatSeries[2]} ${bharatSeries[3]}`;
      return compact.replace(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/, (m, st, d, l, n) => [st, d.padStart(2, '0'), l, n.padStart(4, '0')].filter(Boolean).join(' '));
    }
    function validateAddForm() {
      const f = state.addForm, e = {};
      if (f.name.trim() !== 'Tata Nexon EV') e.name = 'This test is configured for Tata Nexon EV only';
      const plate = normalisePlate(f.plate);
      if (!f.plate.trim()) e.plate = 'Enter the registration number';
      else if (!/^[A-Z]{2} \d{2}( [A-Z]{1,3})? \d{4}$/.test(plate) && !/^\d{2} BH \d{4} [A-Z]{1,2}$/.test(plate))
        e.plate = 'Use the format KL 07 AB 1234';
      else if (state.cars.some(c => c.plate === plate)) e.plate = 'This vehicle is already in your garage';
      const kwh = parseFloat(f.batteryKwh);
      if (!(kwh >= 5 && kwh <= 150)) e.batteryKwh = 'Battery size should be 5–150 kWh';
      return { e, plate, kwh };
    }
    function submitAddVehicle() {
      const { e, plate, kwh } = validateAddForm();
      state.addErrors = e;

        return;

      const name = state.addForm.name.trim();

        name, short: name.replace(/^Tata\s+/i, ''), trim: state.addForm.trim.trim() || 'Standard',
        plate, connector: state.addForm.connector, batteryKwh: kwh,

      state.cars.push(newCar);
      state.carIdx = state.cars.length - 1;
      state.addSuccessVehicle = newCar;
      state.addForm = { name: '', trim: '', plate: '', connector: 'CCS2', batteryKwh: '' };

          <h1 class="h-large">Account</h1>
        </div>

        <!-- User Profile Card -->
        <div class="card p-4 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-full bg-teal text-white font-display font-bold text-[16px] flex items-center justify-center shadow-xs">AM</div>
          <div class="min-w-0 flex-1">
            <div class="font-display text-[15.5px] font-bold leading-tight">Arjun Menon</div>
            <div class="text-[11.5px] text-label2 mt-0.5">+91 98470 •••21 • Kochi, Kerala</div>
          </div>
          ${state.proMember ? '<span class="chip ml-auto">Pro</span>' : ''}
        </div>

        <!-- Prominent Manage Wallet Menu Card -->
        <div>
          <div class="eyebrow px-1 mb-2">PAYMENTS &amp; BALANCE</div>
          <button onclick="openManageWallet()" class="w-full card-glass rounded-[24px] p-4 text-left flex items-center justify-between press group shadow-xs">
            <div class="flex items-center gap-3.5 min-w-0">
              <div class="w-11 h-11 rounded-2xl bg-teal text-white flex items-center justify-center shrink-0 shadow-xs">
                ${I('wallet', 'w-5 h-5 stroke-white')}
              </div>
              <div class="min-w-0">
                <div class="font-display text-[15px] font-bold text-slate-900 leading-tight">Manage Wallet</div>
                <div class="text-[11.5px] text-label2 mt-0.5 truncate">Bank accounts, external wallets &amp; AutoPay</div>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="font-display text-[15px] font-extrabold text-teal num">₹${state.walletInr.toLocaleString('en-IN')}</span>
              <svg class="w-4 h-4 text-label3 group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </div>
          </button>
        </div>

        <!-- Coral-Orange Gradient Pro Pass Card -->
        <div class="rounded-[24px] p-4 text-white shadow-lg" style="background: linear-gradient(135deg, #F37338 0%, #E85A24 100%); box-shadow: 0 10px 26px rgba(232, 90, 36, 0.28);">
          <div class="flex items-center justify-between">
            <span class="flex items-center gap-1.5 text-[10px] font-extrabold tracking-wider uppercase text-white/90">${I('sparkle', 'w-3.5 h-3.5')} VOLTINDIA PRO • KERALA</span>
            <span class="font-display text-[13.5px] font-bold num">₹299 / mo</span>
          </div>
          <p class="text-[11.5px] text-white/95 mt-2.5 leading-relaxed">Zero van call-out fee on every Quick Charge across Kochi plus 2 free 12V jump starts.</p>
          <button onclick="${state.proMember ? `confirmSheet({ title: 'Cancel Pro?', body: 'You will pay the ₹129–149 van call-out fee again from your next booking.', confirmLabel: 'Cancel Pro', cancelLabel: 'Keep Pro', confirmFn: &quot;state.proMember=false; render(); showBanner('Pro cancelled')&quot; })` : `activatePro()`}" class="mt-3.5 w-full min-h-[44px] py-2.5 rounded-full text-[12.5px] font-bold press border border-white/35 transition-all" style="${state.proMember ? 'background: #FFFFFF; color: #E85A24;' : 'background: rgba(255, 255, 255, 0.22); color: #FFFFFF;'}">
            ${state.proMember ? '✓ Active • Manage' : 'Get Pro • ₹299/mo'}
          </button>
        </div>

        <!-- Account Menu Options -->
        <div>
          <div class="eyebrow px-1 mb-2">SERVICES &amp; PREFERENCES</div>
          <div class="card overflow-hidden text-[13px] font-semibold">
            <button onclick="set('activityTab','Recent'); go('08')" class="w-full px-4 py-3.5 flex items-center justify-between text-left press">
              <span class="flex items-center gap-3">${I('receipt', 'w-[18px] h-[18px] text-teal')}GST invoices &amp; receipts</span>${I('chevR', 'w-4 h-4 text-label3')}
            </button>
            <div class="hair ml-4"></div>
            <button onclick="go('09')" class="w-full px-4 py-3.5 flex items-center justify-between text-left press">
              <span class="flex items-center gap-3">${I('car', 'w-[18px] h-[18px] text-teal')}My vehicles</span>${I('chevR', 'w-4 h-4 text-label3')}
            </button>
            <div class="hair ml-4"></div>
            <button onclick="openLocationSheet()" class="w-full px-4 py-3.5 flex items-center justify-between text-left press">
              <span class="flex items-center gap-3">${I('pin', 'w-[18px] h-[18px] text-teal')}Saved Kochi locations</span>${I('chevR', 'w-4 h-4 text-label3')}
            </button>
            <div class="hair ml-4"></div>
            <button onclick="openVoiceCall('control')" class="w-full px-4 py-3.5 flex items-center justify-between text-left press">
              <span class="flex items-center gap-3">${I('phone', 'w-[18px] h-[18px] text-teal')}Help &amp; 24×7 support</span>${I('chevR', 'w-4 h-4 text-label3')}
            </button>
          </div>
        </div>

        <!-- Appearance Menu -->
        <div>
          <div class="eyebrow px-1 mb-2">APPEARANCE</div>
          <div class="card overflow-hidden text-[13px] font-semibold">
            <button id="account-appearance-menu" onclick="openAccountAppearance()" class="w-full px-4 py-3.5 flex items-center justify-between text-left press">
              <span class="flex items-center gap-3">${I('sparkle', 'w-[18px] h-[18px] text-teal')}Theme</span>
              <span class="flex items-center gap-2 text-label2 font-medium">
                ${THEME_OPTIONS.find(option => option.id === state.theme).label}
                ${I('chevR', 'w-4 h-4 text-label3')}
              </span>
            </button>
          </div>
        </div>
      </div>
      `;
    }

    // =====================================================================
    // THEME SEGMENT & MASTER RENDERER
    // =====================================================================
    function themeSeg() {
      const options = THEME_OPTIONS.map(option => {
        const colors = option.id === 'custom' ? state.customTheme : option;
        const shortLabels = {
          light: 'Light', dark: 'Dark', 'mono-dark': 'Black + White', 'mono-light': 'White + Black',
          neon: 'Neon', ocean: 'Ocean Blue', forest: 'Forest Green', graphite: 'Graphite', custom: 'Custom'
        };
        return `
          <button type="button" role="radio" aria-checked="${state.theme === option.id}" aria-label="${option.label}"
            id="theme-option-${option.id}" title="${option.label}" data-theme-option="${option.id}" onclick="setTheme('${option.id}')" class="theme-option press">
            <span class="theme-preview" aria-hidden="true" style="--preview-page:${colors.page};--preview-surface:${colors.surface};--preview-text:${colors.text};--preview-accent:${colors.accent}">
              <span class="theme-preview-card"></span><span class="theme-preview-accent"></span>
            </span>
            <span class="theme-option-label">${shortLabels[option.id]}</span>
          </button>`;
      }).join('');
      const customColors = state.theme === 'custom' ? `
        <div class="card p-3 space-y-2.5">
          <div class="eyebrow">Custom colors</div>
          <div class="custom-theme-colors">
            ${[
              ['page', 'Background'], ['surface', 'Card surface'], ['text', 'Primary text'], ['accent', 'Accent']
            ].map(([key, label]) => `
              <label class="custom-theme-color" for="custom-theme-${key}">
                <span>${label}</span>
                <input id="custom-theme-${key}" type="color" aria-label="Custom theme ${label.toLowerCase()} color"
                  value="${state.customTheme[key]}" oninput="updateCustomThemeColor('${key}', this.value)">
              </label>`).join('')}
          </div>
        </div>` : '';
      return `<div class="theme-grid" role="radiogroup" aria-label="Color themes">${options}</div>${customColors}`;
    }

    const TABS = [
      { label: 'Home', id: '01', icon: 'home' },
      { label: 'Activity', id: '08', icon: 'activity' },
      { label: 'My Vehicles', id: '09', icon: 'car' },
      { label: 'Account', id: '11', icon: 'user' }
    ];
    const RENDERERS = {
      '01': screen01, '02': screen02, '03': screen03, '04': screen04,
      '05': screen05, '06': screen06, '07': screen07, '08': screen08,
      '09': screen09, '10': screen10, '11': screen11, '12': screen12,
      '13': screen13, '14': screen14, '15': screen15, '16': screen16,
      '17': screen17, '18': screen18, '19': screen19, '20': screen20
    };

    function render(animate) {
      const meta = SCREENS.find(s => s.id === state.screen) || SCREENS[0];

      const vp = document.getElementById('ios-viewport');
      // Remember which input had focus so typing isn't interrupted by a re-render
      const ae = document.activeElement;
      const focusId = ae && ae.id && vp.contains(ae) ? ae.id : null;
      const selStart = focusId && 'selectionStart' in ae ? ae.selectionStart : null;
      const scrollTop = vp.scrollTop;
      vp.innerHTML = (RENDERERS[state.screen] || screen01)();
      if (!animate) vp.scrollTop = scrollTop;
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) { el.focus({ preventScroll: true }); try { if (selStart !== null) el.setSelectionRange(selStart, selStart); } catch (e) {} }
      }
      if (animate && vp.firstElementChild) {
        const animClass = state.navDirection === 'pop'
          ? 'ios-anim-pop'
          : state.navDirection === 'tab'
            ? 'ios-anim-tab'
            : 'ios-anim-push';
        vp.firstElementChild.classList.add(animClass);
        const contentCol = vp.firstElementChild.querySelector('.space-y-4, .space-y-3\\.5, .space-y-3');
        if (contentCol && contentCol.children.length <= 8) contentCol.classList.add('ios-stagger');
      }

      const tabBar = document.getElementById('ios-tab-bar');
      if (meta.tabBar) {
        tabBar.style.display = 'grid';
        tabBar.setAttribute('aria-label', 'Main');
        tabBar.classList.toggle('home-liquid-tabs', state.screen === '01');
        const activeLabel = state.screen === '11' ? state.tabLabel : meta.tabName;
        const visibleTabs = TABS;
        tabBar.style.gridTemplateColumns = `repeat(${visibleTabs.length}, minmax(0, 1fr))`;
        tabBar.innerHTML = visibleTabs.map(t => {
          const a = t.label === activeLabel;
          return `
          <button onclick="goTab('${t.id}','${t.label}')" ${a ? 'aria-current="page"' : ''} class="min-h-[48px] flex flex-col items-center justify-center gap-0.5 py-1 transition-all duration-200 press ${a ? 'text-teal scale-105' : 'text-label2'}">
            ${I(t.icon, 'w-[22px] h-[22px]', a ? 2.2 : 1.7)}
            <span class="text-[10px] ${a ? 'font-bold' : 'font-medium'}">${t.label}</span>
          </button>`;
        }).join('');
      } else {
        tabBar.style.display = 'none';
      }
    }

    // =====================================================================
    // IMMERSIVE MODE — opt-in only. The old version forced fullscreen after 3 s
    // and hijacked every double-tap (including double-taps on buttons). Now:
    // double-click/double-tap on an empty, non-interactive area toggles it.
    // =====================================================================
    let isImmersiveMode = false;
    function toggleImmersive() {
      isImmersiveMode = !isImmersiveMode;
      document.body.classList.toggle('is-fullscreen', isImmersiveMode);
      try {
        if (isImmersiveMode && !document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(error => console.warn('Fullscreen request failed', error));
        }
        if (!isImmersiveMode && document.fullscreenElement) {
          document.exitFullscreen?.().catch(error => console.warn('Fullscreen exit failed', error));
        }
      } catch (error) {
        console.warn('Fullscreen change failed', error);
      }
    }
    const isInteractive = (t) => !!t.closest('button, a, input, textarea, select, label, [onclick], #ios-sheet-backdrop, #ios-chat-overlay, #ios-call-overlay');
    document.addEventListener('dblclick', (e) => { if (!isInteractive(e.target)) toggleImmersive(); });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isImmersiveMode) { isImmersiveMode = false; document.body.classList.remove('is-fullscreen'); }
    });

    window.addEventListener('DOMContentLoaded', () => {
      syncPlugToCar();
      render(true);
    });
  </script>
</body>
